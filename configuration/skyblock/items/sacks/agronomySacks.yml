      - '<e>Right Click to open sack!'
    components:
      - id: SKULL_HEAD
        texture: 2ab879e1e590041146bc78c018af5877d39e5475eb7db368fcaf2acda373833d
      - id: SACK
        valid_items:
          - BROWN_MUSHROOM
          - CACTUS
          - CACTUS_GREEN
          - CARROT
          - COCOA_BEANS
          - GOLDEN_CARROT
          - HAY_BALE
          - JACK_O_LANTERN
          - MELON_SLICE
          - MOONFLOWER
          - NETHER_WART
          - POISONOUS_POTATO
          - POTATO
          - PUMPKIN
          - RED_MUSHROOM
          - SEEDS
          - SUGAR_CANE
          - SUNFLOWER
          - WHEAT
          - WILD_ROSE
        max_capacity: 2240
      - id: DEFAULT_CRAFTABLE
        default-craftable: false
        recipes:
          - type: SHAPED
            recipe-type: MINING
            pattern:
              - AAA
              - ABA
              - AAA
            ingredients:
              A:
                type: ENCHANTED_WHEAT
                amount: 16
              B:
                type: ENCHANTED_LEATHER
                amount: 1
            result:
              type: SMALL_AGRONOMY_SACK
              amount: 1

